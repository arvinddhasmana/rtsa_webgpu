# CLASSIFICATION: UNCLASSIFIED
# tools/simulator/scenarios/anomaly-demo.yaml
name: "Anomaly Detection Demo"
description: "Scenario with elevated anomaly rates to demonstrate anomaly detection capabilities"
seed: 99999
duration_minutes: 60

entities:
  surface:
    count: 30
    hostile_ratio: 0.20
    friendly_ratio: 0.35
    neutral_ratio: 0.30
    unknown_ratio: 0.15
    speed_range: [8, 25]
    patterns:
      straight_line: 0.40
      patrol: 0.25
      loitering: 0.20
      random: 0.15
  air:
    count: 15
    hostile_ratio: 0.25
    friendly_ratio: 0.40
    neutral_ratio: 0.20
    unknown_ratio: 0.15
    speed_range: [150, 550]
    altitude_range: [1000, 15000]
    patterns:
      straight_line: 0.50
      patrol: 0.35
      random: 0.15
  subsurface:
    count: 8
    hostile_ratio: 0.25
    friendly_ratio: 0.35
    neutral_ratio: 0.20
    unknown_ratio: 0.20
    speed_range: [5, 15]
    depth_range: [50, 400]
    patterns:
      straight_line: 0.60
      patrol: 0.40

sensors:
  radar:
    count: 3
    sensor_ids: ["RADAR-SIM-001", "RADAR-SIM-002", "RADAR-SIM-003"]
    update_interval_ms: 1000
    coverage_nm: 150
  ais:
    count: 1
    sensor_ids: ["AIS-SIM-001"]
    update_interval_ms: 2000
  ew:
    count: 2
    sensor_ids: ["EW-SIM-001", "EW-SIM-002"]
    update_interval_ms: 2000
  elint:
    count: 1
    sensor_ids: ["ELINT-SIM-001"]
    update_interval_ms: 3000
  isr:
    count: 1
    sensor_ids: ["ISR-SIM-001"]
    update_interval_ms: 5000
  cyber:
    count: 1
    sensor_ids: ["CYBER-SIM-001"]
    update_interval_ms: 5000
    ioc_rate: 5

anomalies:
  # 30% anomaly injection to generate rich anomaly detection data
  injection_rate: 0.30
  types:
    speed: 0.25
    route_deviation: 0.25
    ais_manipulation: 0.20
    behavioral: 0.20
    proximity: 0.10

operational_area:
  center: { lat: 45.0, lon: -60.0 }
  radius_nm: 150
  exclusion_zones:
    - name: "Halifax Harbor"
      center: { lat: 44.65, lon: -63.57 }
      radius_nm: 5
    - name: "Test Exclusion Zone Alpha"
      center: { lat: 45.5, lon: -60.0 }
      radius_nm: 10
