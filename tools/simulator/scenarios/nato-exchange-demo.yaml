# CLASSIFICATION: UNCLASSIFIED
# NATO Exchange Demo — allied interoperability
# Duration: 15 minutes, North Atlantic / GIUK Gap
# Exercises: UC012 (NATO Interoperability), UC011 (STANAG 5516)
name: "NATO Exchange Demo — Allied Interoperability"
description: >
  Simulates a NATO STANAG 5516 data exchange scenario with multi-national
  participation. Includes allied track forwarding, Link-16 messages, and
  NFFI data exchange patterns. Entities span surface and air domains.
seed: 20240606
duration_minutes: 15

entities:
  surface:
    count: 12
    hostile_ratio: 0.20
    friendly_ratio: 0.45
    neutral_ratio: 0.20
    unknown_ratio: 0.15
    speed_range: [4, 22]
    patterns:
      straight_line: 0.40
      patrol: 0.30
      loitering: 0.10
      random: 0.20
  air:
    count: 8
    hostile_ratio: 0.10
    friendly_ratio: 0.55
    neutral_ratio: 0.20
    unknown_ratio: 0.15
    speed_range: [250, 600]
    altitude_range: [3000, 12000]
    patterns:
      straight_line: 0.55
      patrol: 0.35
      random: 0.10

sensors:
  radar:
    count: 3
    sensor_ids: ["RADAR-NATO-01", "RADAR-NATO-02", "RADAR-NATO-03"]
    update_interval_ms: 1500
    coverage_nm: 200
  ais:
    count: 1
    sensor_ids: ["AIS-NATO-01"]
    update_interval_ms: 2000
  ew:
    count: 2
    sensor_ids: ["EW-SIGINT-01", "EW-SIGINT-02"]
    update_interval_ms: 3000
  elint:
    count: 1
    sensor_ids: ["ELINT-NATO-01"]
    update_interval_ms: 4000

anomalies:
  injection_rate: 0.12
  types:
    speed: 0.25
    route_deviation: 0.25
    ais_manipulation: 0.30
    behavioral: 0.20

operational_area:
  center: { lat: 63.0, lon: -20.0 }
  radius_nm: 300
  exclusion_zones:
    - name: "Iceland TMA"
      center: { lat: 64.0, lon: -22.0 }
      radius_nm: 20
