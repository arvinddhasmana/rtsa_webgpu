# CLASSIFICATION: UNCLASSIFIED
input:
  kafka_franz:
    seed_brokers: ["${REDPANDA_BROKERS}"]
    topics:
      - tracks.fused.surface
      - tracks.fused.air
      - tracks.fused.subsurface
      - tracks.fused.land
      - tracks.fused.cyber
    consumer_group: rpconnect-clickhouse-tracks
    start_offset: latest

pipeline:
  processors:
    - mapping: |
        root.track_id = this.track_id
        root.entity_type = this.entity_type
        root.hostile_classification = this.hostile_class
        root.latitude = this.estimated_position.latitude.number(0)
        root.longitude = this.estimated_position.longitude.number(0)
        root.altitude_meters = this.estimated_position.altitude_meters.number(0)
        root.speed_knots = this.estimated_position.speed_knots.number(0)
        root.heading_degrees = this.estimated_position.heading_degrees.number(0)
        root.confidence_score = this.confidence_score.number(0)
        root.source_count = this.source_count.number(0)
        root.source_sensors = this.sources.map_each(s -> s.sensor_id)
        root.classification_level = this.classification
        root.track_status = this.status
        root.event_time = this.updated_at.ts_parse("2006-01-02T15:04:05.999999999Z07:00").ts_format("2006-01-02 15:04:05.000")

output:
  sql_insert:
    driver: clickhouse
    dsn: "clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_HOST}:9000/rtsa"
    table: tracks_fused
    columns:
      - track_id
      - entity_type
      - hostile_classification
      - latitude
      - longitude
      - altitude_meters
      - speed_knots
      - heading_degrees
      - confidence_score
      - source_count
      - source_sensors
      - classification_level
      - track_status
      - event_time
    args_mapping: |
      root = [
        this.track_id,
        this.entity_type,
        this.hostile_classification,
        this.latitude,
        this.longitude,
        this.altitude_meters,
        this.speed_knots,
        this.heading_degrees,
        this.confidence_score,
        this.source_count,
        this.source_sensors,
        this.classification_level,
        this.track_status,
        this.event_time,
      ]
    batching:
      count: 1000
      period: 5s
