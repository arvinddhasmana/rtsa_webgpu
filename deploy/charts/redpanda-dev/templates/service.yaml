# CLASSIFICATION: UNCLASSIFIED
# Headless service "redpanda" — governs the StatefulSet and provides stable
# DNS. In-cluster clients bootstrap via redpanda.<ns>.svc.cluster.local:9092.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: { { .Release.Namespace } }
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: { { .Release.Name } }
    app.kubernetes.io/component: event-backbone
    app.kubernetes.io/managed-by: { { .Release.Service } }
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: { { .Release.Name } }
  ports:
    - name: kafka
      port: { { .Values.ports.kafka } }
      targetPort: kafka
      protocol: TCP
    - name: admin
      port: { { .Values.ports.admin } }
      targetPort: admin
      protocol: TCP
    - name: rpc
      port: { { .Values.ports.rpc } }
      targetPort: rpc
      protocol: TCP
    - name: schema-registry
      port: { { .Values.ports.schemaRegistry } }
      targetPort: schema-registry
      protocol: TCP
    - name: panda-proxy
      port: { { .Values.ports.pandaProxy } }
      targetPort: panda-proxy
      protocol: TCP
