# CLASSIFICATION: UNCLASSIFIED
{{- if .Values.topics.create }}
# Post-install/upgrade Job that provisions the RTSA topics once the broker is
# ready. Existing topics are accepted only after explicit verification.
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-create-topics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: topic-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/component: topic-bootstrap
    spec:
      restartPolicy: OnFailure
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: create-topics
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              BROKER="redpanda.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.kafka }}"
              echo "waiting for broker ${BROKER} ..."
              until rpk cluster info --brokers "${BROKER}" >/dev/null 2>&1; do
                sleep 2
              done
              echo "broker ready; creating topics"
              {{- $manifest := fromJson (.Files.Get "topics.json") }}
              {{- range $topic := $manifest.topics }}
              if ! rpk topic create {{ $topic.name }} --brokers "${BROKER}" -p {{ $topic.partitions }} -r {{ $topic.replicas }}; then
                if rpk topic describe {{ $topic.name }} --brokers "${BROKER}" >/dev/null 2>&1; then
                  echo "topic {{ $topic.name }} already exists"
                else
                  echo "failed to create or verify topic {{ $topic.name }}" >&2
                  exit 1
                fi
              fi
              rpk topic alter-config {{ $topic.name }} --brokers "${BROKER}" --set retention.ms={{ printf "%.0f" $topic.retention_ms }}
              {{- end }}
              echo "topic bootstrap complete"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
