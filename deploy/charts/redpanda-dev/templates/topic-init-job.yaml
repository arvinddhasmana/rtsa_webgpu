# CLASSIFICATION: UNCLASSIFIED
{{- if .Values.topics.create }}
# Post-install/upgrade Job that provisions the RTSA topics once the broker is
# ready. Idempotent (|| true) so re-runs are safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-create-topics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: topic-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/component: topic-bootstrap
    spec:
      restartPolicy: OnFailure
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: create-topics
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              BROKER="redpanda.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.kafka }}"
              echo "waiting for broker ${BROKER} ..."
              until rpk cluster info --brokers "${BROKER}" >/dev/null 2>&1; do
                sleep 2
              done
              echo "broker ready; creating topics"
              {{- range .Values.topics.list }}
              rpk topic create {{ . }} --brokers "${BROKER}" -p {{ $.Values.topics.partitions }} -r {{ $.Values.topics.replicas }} || true
              {{- end }}
              echo "topic bootstrap complete"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
