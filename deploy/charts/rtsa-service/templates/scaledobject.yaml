# CLASSIFICATION: UNCLASSIFIED
{{ if eq .Values.autoscaling.mode "keda" -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rtsa-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtsa-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rtsa-service.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.autoscaling.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.keda.cooldownPeriod }}
  {{- if not .Values.autoscaling.keda.triggers }}
  {{- fail "autoscaling.mode=keda requires at least one autoscaling.keda.triggers entry" }}
  {{- end }}
  triggers:
    {{- toYaml .Values.autoscaling.keda.triggers | nindent 4 }}
{{- end }}
