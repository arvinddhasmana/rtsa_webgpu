# CLASSIFICATION: UNCLASSIFIED
{{ if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rtsa-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtsa-service.labels" . | nindent 4 }}
    {{- if .Values.serviceAccount.workloadIdentityClientId }}
    azure.workload.identity/use: "true"
    {{- end }}
  annotations:
    {{- with .Values.serviceAccount.workloadIdentityClientId }}
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
{{- end }}
