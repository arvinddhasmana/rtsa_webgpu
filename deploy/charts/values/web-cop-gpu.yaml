# CLASSIFICATION: UNCLASSIFIED
# web-cop-gpu — SolidJS + WebGPU Common Operating Picture (nginx static bundle).
nameOverride: web-cop-gpu
replicaCount: 2

# nginx serves on :8080 (unprivileged); no gRPC/metrics ports.
ports:
  grpc: null
  health: null
  metrics: null
extraPorts:
  - name: http
    containerPort: 8080

service:
  enabled: true
  extraPorts:
    - name: http
      port: 80
      targetPort: http

# The frontend tier runs on the default system pool (no bulkhead taint),
# but needs to tolerate the critical addons taint applied to it.
nodeSelector: {}
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule

# Run as non-root unprivileged user (101) with read-only root FS capability and dropped capabilities.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

metrics:
  enabled: false

probes:
  liveness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10

autoscaling:
  mode: hpa
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
