# CLASSIFICATION: UNCLASSIFIED
# svc-fusion-engine — consumes sensors.* and produces tracks.fused.*.
# Scales on Redpanda consumer-group lag via KEDA.
nameOverride: svc-fusion-engine
replicaCount: 1

ports:
  grpc: 50051
  health: 8081
  metrics: 9090

# Bulkhead: processing Spot pool.
nodeSelector:
  workload: processing
tolerations:
  - key: workload
    operator: Equal
    value: processing
    effect: NoSchedule
  # AKS taints Spot-priority nodes implicitly; without this the pool can never scale up from 0.
  - key: kubernetes.azure.com/scalesetpriority
    operator: Equal
    value: spot
    effect: NoSchedule

env:
  - name: RTSA_SERVICE_NAME
    value: svc-fusion-engine
  - name: RTSA_REDPANDA_BROKERS
    value: redpanda.rtsa.svc.cluster.local:9092
  - name: RTSA_FUSION_CONSUMER_GROUP
    value: fusion-engine
  - name: RTSA_FUSION_OUTPUT_PREFIX
    value: tracks.fused
  - name: RTSA_HEALTH_PORT
    value: "8081"
  - name: RTSA_METRICS_PORT
    value: "9090"
  - name: RTSA_TLS_ENABLED
    value: "false"
  - name: RTSA_LOG_LEVEL
    value: info
  - name: RTSA_LOG_FORMAT
    value: json
  - name: RTSA_OTEL_ENDPOINT
    value: otel-collector.observability.svc.cluster.local:4317

probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10

autoscaling:
  mode: keda
  minReplicas: 1
  maxReplicas: 6
  keda:
    pollingInterval: 15
    cooldownPeriod: 60
    triggers:
      - type: kafka
        metadata:
          bootstrapServers: redpanda.rtsa.svc.cluster.local:9092
          consumerGroup: fusion-engine
          topic: sensors.radar.tracks
          lagThreshold: "1000"
          offsetResetPolicy: latest

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi
