# CLASSIFICATION: UNCLASSIFIED
# svc-query — historical query API backed by ClickHouse (cold path).
nameOverride: svc-query
replicaCount: 1

# svc-query uses non-default ports (50072 / 8082 / 9092).
ports:
  grpc: 50072
  health: 8082
  metrics: 9092

nodeSelector:
  workload: processing
tolerations:
  - key: workload
    operator: Equal
    value: processing
    effect: NoSchedule

env:
  - name: RTSA_SERVICE_NAME
    value: svc-query
  - name: RTSA_QUERY_GRPC_PORT
    value: "50072"
  - name: RTSA_HEALTH_PORT
    value: "8082"
  - name: RTSA_METRICS_PORT
    value: "9092"
  - name: RTSA_CLICKHOUSE_DSN
    value: clickhouse://default:@clickhouse.rtsa.svc.cluster.local:9000/rtsa
  - name: RTSA_CLICKHOUSE_DATABASE
    value: rtsa
  - name: RTSA_REDPANDA_BROKERS
    value: redpanda.rtsa.svc.cluster.local:9092
  - name: RTSA_LOG_LEVEL
    value: info
  - name: RTSA_LOG_FORMAT
    value: json

probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10

autoscaling:
  mode: none
  minReplicas: 1
  maxReplicas: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
