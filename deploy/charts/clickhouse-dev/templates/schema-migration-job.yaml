# CLASSIFICATION: UNCLASSIFIED
{{- $migrationFiles := .Files.Glob "migrations/*.sql" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema-migration
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: schema-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: schema-migration
    spec:
      restartPolicy: OnFailure
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/bash
            - -ec
            - |
              until clickhouse-client --host clickhouse.{{ .Release.Namespace }}.svc.cluster.local --query 'SELECT 1' >/dev/null 2>&1; do
                sleep 2
              done
              {{- range $path, $_ := $migrationFiles }}
              echo "Applying {{ base $path }}"
              clickhouse-client \
                --host clickhouse.{{ $.Release.Namespace }}.svc.cluster.local \
                --multiquery < "/migrations/{{ base $path }}"
              {{- end }}
              for table in sensor_observations tracks_fused anomaly_detections audit_log operator_feedback; do
                clickhouse-client \
                  --host clickhouse.{{ .Release.Namespace }}.svc.cluster.local \
                  --query "EXISTS TABLE {{ .Values.database }}.${table}" | grep -qx 1
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: clickhouse-migrations
