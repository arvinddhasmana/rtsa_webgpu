# CLASSIFICATION: UNCLASSIFIED
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: rtsa-cop
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/part-of: rtsa
    classification: unclassified
    {{- with .Values.gateway.revision }}
    istio.io/rev: {{ . | quote }}
    {{- end }}
spec:
  selector:
    {{- toYaml .Values.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.gateway.tlsSecretName }}
      hosts:
        - {{ .Values.host | quote }}
