      RTSA_OTEL_ENDPOINT: otel-collector:4317
      RTSA_LOG_LEVEL: debug
      RTSA_LOG_FORMAT: json
      # Correct topic names matching what ingestion services publish to
      RTSA_FUSION_INPUT_TOPICS: sensors.radar.tracks,sensors.ew.intercepts,sensors.elint.detections,sensors.isr.observations,sensors.ais.positions,sensors.cyber.iocs
