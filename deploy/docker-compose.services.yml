# CLASSIFICATION: UNCLASSIFIED
# RTSA Application Services — overlay for docker-compose.yml
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.services.yml up -d

services:
  svc-radar-ingestion:
    build:
      context: ..
      dockerfile: svc-radar-ingestion/Dockerfile
    container_name: rtsa-radar-ingestion
    environment:
      RTSA_SERVICE_NAME: svc-radar-ingestion
      RTSA_GRPC_PORT: "50051"
      RTSA_HEALTH_PORT: "8081"
      RTSA_REDPANDA_BROKERS: redpanda:9092
      RTSA_REDPANDA_TLS_ENABLED: "false"
      RTSA_OTEL_ENDPOINT: otel-collector:4317
      RTSA_LOG_LEVEL: debug
      RTSA_LOG_FORMAT: json
      RTSA_TLS_CA_CERT: /certs/ca.crt
      RTSA_TLS_SERVER_CERT: /certs/server.crt
      RTSA_TLS_SERVER_KEY: /certs/server.key
    ports:
      - "50051:50051"
    volumes:
      - ../certs/dev:/certs:ro
    depends_on:
      redpanda:
        condition: service_healthy
    # Note: grpc_health_probe requires standard grpc.health.v1.Health service
    # svc-radar-ingestion uses custom commonv1.HealthServiceServer instead
    # TODO: Register google.golang.org/grpc/health in the service for standard health checks
    networks:
      - rtsa-net

  svc-ew-ingestion:
    build:
      context: ..
      dockerfile: svc-ew-ingestion/Dockerfile
    container_name: rtsa-ew-ingestion
    environment:
      RTSA_SERVICE_NAME: svc-ew-ingestion
      RTSA_GRPC_PORT: "50051"
      RTSA_HEALTH_PORT: "8081"
      RTSA_REDPANDA_BROKERS: redpanda:9092
      RTSA_REDPANDA_TLS_ENABLED: "false"
      RTSA_OTEL_ENDPOINT: otel-collector:4317
      RTSA_LOG_LEVEL: debug
      RTSA_LOG_FORMAT: json
    ports:
      - "50052:50051"
    volumes:
      - ../certs/dev:/certs:ro
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - rtsa-net

  svc-elint-ingestion:
