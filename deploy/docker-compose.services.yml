      RTSA_HEALTH_PORT: "8081"
      RTSA_REDPANDA_BROKERS: redpanda:9092
      RTSA_REDPANDA_TLS_ENABLED: "false"
      RTSA_OTEL_ENDPOINT: otel-collector:4317
      RTSA_LOG_LEVEL: debug
      RTSA_LOG_FORMAT: json
      RTSA_ENVIRONMENT: development
    ports:
      - "50074:50051"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - rtsa-net
    restart: unless-stopped

  svc-training:
    build:
      context: ..
      dockerfile: svc-training/Dockerfile
    container_name: rtsa-training
    environment:
      RTSA_SERVICE_NAME: svc-training
      RTSA_HEALTH_PORT: "8081"
      INPUT_TOPIC: feedback.operator.validated
      OUTPUT_TOPIC: models.anomaly.candidates
      RTSA_REDPANDA_BROKERS: redpanda:9092
      RTSA_REDPANDA_TLS_ENABLED: "false"
      CONSUMER_GROUP: svc-training
      RTSA_OTEL_ENDPOINT: otel-collector:4317
      RTSA_ENVIRONMENT: development
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - rtsa-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Envoy — API Gateway / gRPC-Web Proxy
  # ──────────────────────────────────────────
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: rtsa-envoy
    ports:
      - "8443:8443" # gRPC-Web (TLS)
      - "9901:9901" # Admin interface (dev only)
    volumes:
      - ./envoy/envoy-dev.yaml:/etc/envoy/envoy.yaml:ro
      - ../certs/dev:/certs:ro
    depends_on:
      - svc-track
      - svc-alert
      - svc-query
      - svc-feedback
      - svc-audit
    networks:
      - rtsa-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Redpanda Connect — ETL Pipelines
  # ──────────────────────────────────────────
  rpconnect-tracks:
    image: redpandadata/connect:4
    container_name: rtsa-rpconnect-tracks
    volumes:
      - ./redpanda-connect/tracks-to-clickhouse.yaml:/connect.yaml:ro
    environment:
      REDPANDA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev_password_change_me}
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - rtsa-net

  rpconnect-sensors:
    image: redpandadata/connect:4
    container_name: rtsa-rpconnect-sensors
    volumes:
      - ./redpanda-connect/sensors-to-clickhouse.yaml:/connect.yaml:ro
    environment:
      REDPANDA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev_password_change_me}
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - rtsa-net

  rpconnect-alerts:
    image: redpandadata/connect:4
    container_name: rtsa-rpconnect-alerts
    volumes:
      - ./redpanda-connect/alerts-to-clickhouse.yaml:/connect.yaml:ro
    environment:
      REDPANDA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev_password_change_me}
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - rtsa-net

  rpconnect-feedback:
    image: redpandadata/connect:4
    container_name: rtsa-rpconnect-feedback
    volumes:
      - ./redpanda-connect/feedback-to-clickhouse.yaml:/connect.yaml:ro
    environment:
      REDPANDA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev_password_change_me}
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - rtsa-net

  rpconnect-audit:
    image: redpandadata/connect:4
    container_name: rtsa-rpconnect-audit
    volumes:
      - ./redpanda-connect/audit-to-clickhouse.yaml:/connect.yaml:ro
    environment:
      REDPANDA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev_password_change_me}
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - rtsa-net
  # ──────────────────────────────────────────
  # Simulator — Test Data Generator
  # Usage: docker compose ... run --rm simulator [flags]
  # ──────────────────────────────────────────
  simulator:
    build:
      context: ..
      dockerfile: tools/simulator/Dockerfile
    container_name: rtsa-simulator
    image: rtsa-simulator:latest
    environment:
      SIM_RADAR_ENDPOINT: svc-radar-ingestion:50051
      SIM_EW_ENDPOINT: svc-ew-ingestion:50051
      SIM_ELINT_ENDPOINT: svc-elint-ingestion:50051
      SIM_ISR_ENDPOINT: svc-isr-ingestion:50051
      SIM_AIS_ENDPOINT: svc-ais-ingestion:50051
      SIM_CYBER_ENDPOINT: svc-cyber-ingestion:50051
      SIM_TLS_ENABLED: "false"
    depends_on:
      - svc-radar-ingestion
      - svc-ew-ingestion
      - svc-elint-ingestion
      - svc-isr-ingestion
      - svc-ais-ingestion
      - svc-cyber-ingestion
    networks:
      - rtsa-net
    profiles:
      - demo

  # ──────────────────────────────────────────
  # Web-COP — React Common Operating Picture
  # ──────────────────────────────────────────
  web-cop:
    build:
      context: ..
      dockerfile: web-cop/Dockerfile
    container_name: rtsa-web-cop
    ports:
      - "5173:80"
    depends_on:
      - envoy
    networks:
      - rtsa-net
    restart: unless-stopped
