      RTSA_REDPANDA_TLS_ENABLED: "false"
      RTSA_CLICKHOUSE_DSN: "clickhouse://default:${CLICKHOUSE_PASSWORD:-dev_password_change_me}@clickhouse:9000/rtsa"
