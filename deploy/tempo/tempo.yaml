# CLASSIFICATION: UNCLASSIFIED
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
    pool:
      max_workers: 50
      queue_depth: 2000

metrics_generator:
  storage:
    path: /tmp/tempo/generator/wal
