# CLASSIFICATION: UNCLASSIFIED
version: v2
plugins:
  # Go code generation
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  # Go gRPC code generation
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
