# CLASSIFICATION: UNCLASSIFIED
# Reusable: build a single service image, generate an SBOM, keyless-sign with
# cosign, scan with Trivy, and push to Azure Container Registry via OIDC.
name: reusable-container

on:
  workflow_call:
    inputs:
      service:
        description: Service directory / image name (e.g. svc-track).
        type: string
        required: true
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        required: true
      context:
        description: Docker build context.
        type: string
        default: "."
      image-tag:
        description: Image tag (typically the commit SHA).
        type: string
        required: true
      acr-name:
        description: Azure Container Registry name (without .azurecr.io).
        type: string
        required: true
      client-id:
        description: Entra federated app (UAMI) client id for OIDC.
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        type: string
        required: true
      build-args:
        description: Newline-delimited docker build args.
        type: string
        default: ""

permissions:
  id-token: write # OIDC to Azure + cosign keyless
  contents: read
  security-events: write # Trivy SARIF upload

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.acr-name }}.azurecr.io/${{ inputs.service }}:${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.client-id }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      - name: ACR login
        run: az acr login --name ${{ inputs.acr-name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}
          build-args: ${{ inputs.build-args }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull pushed image into local Docker daemon
        run: docker pull --platform linux/arm64 ${{ env.IMAGE }}

      - name: Get ACR credentials for registry operations
        id: acr
        shell: bash
        run: |
          echo "username=$(az acr credential show -n ${{ inputs.acr-name }} --query username -o tsv)" >> "$GITHUB_OUTPUT"
          echo "password=$(az acr credential show -n ${{ inputs.acr-name }} --query passwords[0].value -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX)
        run: syft docker:${{ env.IMAGE }} --platform linux/arm64 -o spdx-json > sbom-${{ inputs.service }}.spdx.json

      - name: Trivy image scan (fail on CRITICAL/HIGH)
        env:
          TRIVY_USERNAME: ${{ steps.acr.outputs.username }}
          TRIVY_PASSWORD: ${{ steps.acr.outputs.password }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-${{ inputs.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', inputs.service)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ inputs.service }}.sarif
          category: trivy-${{ inputs.service }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to ACR for cosign
        env:
          ACR_USERNAME: ${{ steps.acr.outputs.username }}
          ACR_PASSWORD: ${{ steps.acr.outputs.password }}
        run: |
          cosign login ${{ inputs.acr-name }}.azurecr.io --username "$ACR_USERNAME" --password "$ACR_PASSWORD"

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ env.IMAGE }}

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign attest --yes --predicate sbom-${{ inputs.service }}.spdx.json --type spdxjson ${{ env.IMAGE }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service }}
          path: sbom-${{ inputs.service }}.spdx.json
          retention-days: 30
