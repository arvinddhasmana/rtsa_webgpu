# CLASSIFICATION: UNCLASSIFIED
# CD Deploy — promote the latest built images to a higher environment. Each
# service is deployed independently: if it's not running yet, the latest ACR
# tag is used; if it's already running, it's only redeployed when ACR has a
# newer tag than what's live. Higher environments (staging/prod) are gated by
# GitHub Environment protection rules (required reviewers, wait timers).
name: CD Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment.
        type: choice
        options: [dev, test, staging, prod]
        required: true
      image-tag:
        description: Full commit SHA of an image set already pushed to ACR.
        type: string
        required: true
      clean-before-deploy:
        description: Uninstall all stateless service releases and force-delete stuck pods before deploying. Use to recover from a corrupted/stuck cluster state.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-helm.yml
    with:
      environment: ${{ inputs.environment }}
      namespace: rtsa
      image-tag: ${{ inputs.image-tag }}
      deploy-all-at-tag: true
      clean-before-deploy: ${{ inputs.clean-before-deploy }}
