# CLASSIFICATION: UNCLASSIFIED
# CD Deploy — promote an already-built, signed image set to a higher environment.
# Promotion is by image tag (digest): the exact artifact validated downstream is
# what ships. Higher environments (staging/prod) are gated by GitHub Environment
# protection rules (required reviewers, wait timers).
name: CD Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment.
        type: choice
        options: [dev, test, staging, prod]
        required: true
      image-tag:
        description: Image tag to deploy (commit SHA already built by CD Build).
        type: string
        required: true
      clean-before-deploy:
        description: Uninstall all stateless service releases and force-delete stuck pods before deploying. Use to recover from a corrupted/stuck cluster state.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-helm.yml
    with:
      environment: ${{ inputs.environment }}
      image-tag: ${{ inputs.image-tag }}
      namespace: rtsa
      clean-before-deploy: ${{ inputs.clean-before-deploy }}
