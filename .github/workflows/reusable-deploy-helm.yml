# CLASSIFICATION: UNCLASSIFIED
# Reusable: deploy the RTSA walking skeleton to an AKS environment via Helm.
name: reusable-deploy-helm

on:
  workflow_call:
    inputs:
      environment:
        description: Target GitHub Environment (dev|test|staging|prod).
        type: string
        required: true
      namespace:
        type: string
        default: "rtsa"
      image-tag:
        description: Immutable image tag already pushed to ACR.
        type: string
        required: true
      changed-services:
        description: JSON array of services changed in the current build. Empty means deploy all services using image-tag.
        type: string
        default: "[]"
      clean-before-deploy:
        description: Uninstall all stateless service releases and force-delete stuck pods before deploying. Use to recover from a corrupted/stuck cluster state.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: ${{ inputs.namespace }}
      ACR: ${{ vars.ACR_NAME }}
      ISTIO_REV: ${{ vars.ISTIO_REVISION }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.19

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # Pin explicitly — an unpinned "latest" silently jumped to the Helm 4
          # major release and changed CLI/JSON behavior mid-pipeline.
          version: "v4.2.4"

      - name: Namespace + Istio injection label
        run: |
          set -euo pipefail
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "$ISTIO_REV" ]; then
            kubectl label namespace "$NS" istio.io/rev="$ISTIO_REV" --overwrite
          else
            kubectl label namespace "$NS" istio-injection=enabled --overwrite
          fi

      - name: Deploy mesh baseline
        run: |
          helm upgrade --install rtsa-mesh deploy/charts/rtsa-mesh \
            --namespace "$NS" \
            --set createNamespace=false \
            --set namespace="$NS" \
            --set istio.revision="$ISTIO_REV" \
            --wait --timeout 5m

      - name: Deploy Redpanda (event backbone)
        run: |
          set -x
          kubectl get nodes -o wide || true
          kubectl describe node || true
          helm upgrade --install redpanda deploy/charts/redpanda-dev \
            --namespace "$NS" --wait --timeout 10m || {
              echo "=== Pod status in $NS ==="
              kubectl get pods -n "$NS" -o wide
              echo "=== Redpanda pod describe ==="
              kubectl describe pod -l app.kubernetes.io/name=redpanda -n "$NS" || true
              echo "=== Redpanda pod logs ==="
              kubectl logs -l app.kubernetes.io/name=redpanda -n "$NS" -c redpanda --tail=200 || true
              kubectl logs -l app.kubernetes.io/name=redpanda -n "$NS" -c istio-proxy --tail=100 || true
              echo "=== Topic init job pod describe ==="
              kubectl describe pod -l app.kubernetes.io/component=topic-bootstrap -n "$NS" || true
              echo "=== Topic init job logs ==="
              kubectl logs -l app.kubernetes.io/component=topic-bootstrap -n "$NS" -c create-topics --tail=100 || true
              exit 1
            }

      - name: Deploy ClickHouse (OLAP store)
        run: |
          helm upgrade --install clickhouse deploy/charts/clickhouse-dev \
            --namespace "$NS" --wait --timeout 10m

      - name: Clean stateless services (optional)
        if: ${{ inputs.clean-before-deploy }}
        run: |
          set -euo pipefail
          for svc in svc-radar-ingestion svc-ew-ingestion svc-elint-ingestion svc-isr-ingestion svc-ais-ingestion svc-cyber-ingestion svc-fusion-engine svc-track svc-query svc-webtransport web-cop-gpu; do
            echo "::group::clean $svc"
            helm uninstall "$svc" --namespace "$NS" --wait --timeout 5m || true
            kubectl delete pods -n "$NS" -l app.kubernetes.io/instance="$svc" --force --grace-period=0 --ignore-not-found
            kubectl delete replicaset -n "$NS" -l app.kubernetes.io/instance="$svc" --ignore-not-found
            echo "::endgroup::"
          done

      - name: Deploy stateless services
        run: |
          set -uo pipefail
          # Changed services use the new immutable SHA. Healthy unchanged releases
          # stay untouched; missing releases use their latest existing ACR tag.
          svc_tag="${{ inputs.image-tag }}"
          changed_services='${{ inputs.changed-services }}'
          all_services_mode=$([[ "$changed_services" == "[]" ]] && echo true || echo false)
          all_stateless_services=(
            svc-radar-ingestion
            svc-ew-ingestion
            svc-elint-ingestion
            svc-isr-ingestion
            svc-ais-ingestion
            svc-cyber-ingestion
            svc-fusion-engine
            svc-track
            svc-query
            svc-webtransport
            web-cop-gpu
          )

          failed_services=()
          for svc in "${all_stateless_services[@]}"; do
            echo "::group::$svc"

            current_image="$(kubectl get deployment "$svc" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            current_tag="${current_image##*:}"
            deploy_tag=""
            if [[ "$all_services_mode" == true ]] || python3 -c 'import json, sys; sys.exit(0 if sys.argv[1] in json.loads(sys.argv[2]) else 1)' "$svc" "$changed_services"; then
              deploy_tag="$svc_tag"
            elif [[ -n "$current_image" ]]; then
              helm_status="$(helm status "$svc" --namespace "$NS" -o json 2>/dev/null | jq -r '.info.status // empty' 2>/dev/null || true)"
              if [[ "$helm_status" == "failed" ]]; then
                deploy_tag="$current_tag"
              else
                echo "Skipping healthy unchanged release $svc ($current_tag)."
                echo "::endgroup::"
                continue
              fi
            else
              deploy_tag="$(scripts/azure/resolve-acr-tag.sh --acr "$ACR" --repository "$svc")" || {
                failed_services+=("$svc")
                echo "::endgroup::"
                continue
              }
            fi

            extra_args=()
            if [[ "$svc" == "svc-webtransport" ]]; then
              extra_args=(
                --set "serviceAccount.workloadIdentityClientId=${{ vars.WEBTRANSPORT_IDENTITY_CLIENT_ID }}"
                --set "secretProviderClass.keyvaultName=${{ vars.KEY_VAULT_NAME }}"
                --set "secretProviderClass.tenantId=${{ vars.AZURE_TENANT_ID }}"
              )
            fi

            # ingestion/processing pools are Spot, scale-to-zero; node bootstrap
            # after a scale-up-from-0 event can take longer than 5m.
            if ! helm upgrade --install "$svc" deploy/charts/rtsa-service \
                -f "deploy/charts/values/$svc.yaml" \
                --namespace "$NS" \
                --set image.repository="$ACR.azurecr.io/$svc" \
                --set image.tag="$deploy_tag" \
                "${extra_args[@]}" \
                --wait --timeout 10m; then
              echo "=== Pod status in $NS ==="
              kubectl get pods -n "$NS" -o wide
              echo "=== $svc pod describe ==="
              kubectl describe pod -l app.kubernetes.io/instance="$svc" -n "$NS" || true
              echo "=== $svc pod logs ==="
              kubectl logs -l app.kubernetes.io/instance="$svc" -n "$NS" --all-containers --tail=200 || true
              failed_services+=("$svc")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed_services[@]} -gt 0 ]; then
            echo "ERROR: failed to deploy: ${failed_services[*]}" >&2
            exit 1
          fi

      - name: Configure public COP HTTPS gateway
        run: |
          set -euo pipefail
          ingress_ip="$(kubectl get svc aks-istio-ingressgateway-external \
            --namespace aks-istio-ingress \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          [[ -n "$ingress_ip" ]] || {
            echo "ERROR: managed Istio ingress gateway has no public IP" >&2
            exit 1
          }
          istio_revision="$(kubectl get pod -n aks-istio-ingress \
            -l app=aks-istio-ingressgateway-external \
            -o jsonpath='{.items[0].metadata.labels.istio\\.io/rev}')"
          [[ -n "$istio_revision" ]] || {
            echo "ERROR: managed Istio ingress gateway has no revision label" >&2
            exit 1
          }

          cop_hostname="${{ vars.COP_HOSTNAME }}"
          # Dev fallback uses wildcard DNS for the current IP. Production must
          # set COP_HOSTNAME to an approved DNS name and certificate.
          [[ -n "$cop_hostname" ]] || cop_hostname="${ingress_ip//./-}.sslip.io"
          [[ "$cop_hostname" != "$ingress_ip" ]] || {
            echo "ERROR: COP_HOSTNAME must be a DNS hostname, not the gateway IP" >&2
            exit 1
          }
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$tmp_dir/tls.key" \
            -out "$tmp_dir/tls.crt" \
            -days 30 \
            -subj "/CN=${cop_hostname}" \
            -addext "subjectAltName=DNS:${cop_hostname},IP:${ingress_ip}"
          kubectl create secret tls rtsa-cop-tls \
            --namespace aks-istio-ingress \
            --cert="$tmp_dir/tls.crt" \
            --key="$tmp_dir/tls.key" \
            --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install rtsa-edge deploy/charts/rtsa-edge \
            --namespace aks-istio-ingress \
            --set "host=$cop_hostname" \
            --set "gateway.revision=$istio_revision" \
            --set "gateway.tlsSecretName=rtsa-cop-tls" \
            --wait --timeout 5m

          kubectl get gateway rtsa-cop --namespace aks-istio-ingress
          kubectl get virtualservice rtsa-cop --namespace "$NS"
          curl --fail --silent --show-error --insecure \
            --resolve "${cop_hostname}:443:${ingress_ip}" \
            "https://${cop_hostname}/" >/dev/null

      - name: Verify workload deployment
        run: |
          set -euo pipefail
          changed_services='${{ inputs.changed-services }}'
          verify_args=(--namespace "$NS")
          if [[ "$changed_services" != "[]" ]]; then
            changed_services_list="$(python3 -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$changed_services")"
            verify_args+=(--changed-deployments "$changed_services_list")
          fi
          scripts/azure/verify-workload-deployment.sh "${verify_args[@]}"
