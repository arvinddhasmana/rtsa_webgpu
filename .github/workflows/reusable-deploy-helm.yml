# CLASSIFICATION: UNCLASSIFIED
# Reusable: deploy the RTSA walking skeleton to an AKS environment via Helm.
name: reusable-deploy-helm

on:
  workflow_call:
    inputs:
      environment:
        description: Target GitHub Environment (dev|test|staging|prod).
        type: string
        required: true
      image-tag:
        description: Image tag to deploy (commit SHA validated upstream).
        type: string
        required: true
      namespace:
        type: string
        default: "rtsa"
      go-services:
        description: JSON array of Go services to (re)deploy with image-tag. Defaults to all (used by promotions where every service was built at this SHA).
        type: string
        default: '["svc-radar-ingestion","svc-fusion-engine","svc-track","svc-webtransport","svc-query"]'
      deploy-web:
        description: Whether to (re)deploy web-cop-gpu with image-tag.
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NS: ${{ inputs.namespace }}
      ACR: ${{ vars.ACR_NAME }}
      TAG: ${{ inputs.image-tag }}
      ISTIO_REV: ${{ vars.ISTIO_REVISION }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.19

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Namespace + Istio injection label
        run: |
          set -euo pipefail
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "$ISTIO_REV" ]; then
            kubectl label namespace "$NS" istio.io/rev="$ISTIO_REV" --overwrite
          else
            kubectl label namespace "$NS" istio-injection=enabled --overwrite
          fi

      - name: Deploy mesh baseline
        run: |
          helm upgrade --install rtsa-mesh deploy/charts/rtsa-mesh \
            --namespace "$NS" \
            --set createNamespace=false \
            --set namespace="$NS" \
            --set istio.revision="$ISTIO_REV" \
            --wait --timeout 5m

      - name: Deploy Redpanda (event backbone)
        run: |
          set -x
          kubectl get nodes -o wide || true
          kubectl describe node || true
          # cascade=orphan only deletes the StatefulSet object; the underlying
          # Pod is left running/Pending and gets reused (with its stale spec) by
          # the next helm upgrade unless we force-delete it too.
          kubectl delete statefulset redpanda --namespace "$NS" --cascade=orphan || true
          kubectl delete pod redpanda-0 --namespace "$NS" --force --grace-period=0 || true
          kubectl delete pvc data-redpanda-0 --namespace "$NS" || true
          kubectl delete job redpanda-create-topics --namespace "$NS" || true
          helm upgrade --install redpanda deploy/charts/redpanda-dev \
            --namespace "$NS" --wait --timeout 10m || {
              echo "=== Pod status in $NS ==="
              kubectl get pods -n "$NS" -o wide
              echo "=== Redpanda pod describe ==="
              kubectl describe pod -l app.kubernetes.io/name=redpanda -n "$NS" || true
              echo "=== Redpanda pod logs ==="
              kubectl logs -l app.kubernetes.io/name=redpanda -n "$NS" -c redpanda --tail=200 || true
              kubectl logs -l app.kubernetes.io/name=redpanda -n "$NS" -c istio-proxy --tail=100 || true
              echo "=== Topic init job pod describe ==="
              kubectl describe pod -l app.kubernetes.io/component=topic-bootstrap -n "$NS" || true
              echo "=== Topic init job logs ==="
              kubectl logs -l app.kubernetes.io/component=topic-bootstrap -n "$NS" -c create-topics --tail=100 || true
              exit 1
            }

      - name: Deploy ClickHouse (OLAP store)
        run: |
          # See Redpanda step above: force-delete the orphaned pod too, or it
          # gets reused with its stale (pre-fix) spec on every subsequent upgrade.
          kubectl delete statefulset clickhouse --namespace "$NS" --cascade=orphan || true
          kubectl delete pod clickhouse-0 --namespace "$NS" --force --grace-period=0 || true
          kubectl delete pvc data-clickhouse-0 --namespace "$NS" || true
          helm upgrade --install clickhouse deploy/charts/clickhouse-dev \
            --namespace "$NS" --wait --timeout 10m

      - name: Deploy stateless services
        env:
          GO_SERVICES: ${{ inputs.go-services }}
        run: |
          set -euo pipefail
          # svc-webtransport is deployed separately below (needs workload identity + Key Vault settings).
          mapfile -t services < <(echo "$GO_SERVICES" | jq -r '.[] | select(. != "svc-webtransport")')
          if [ ${#services[@]} -eq 0 ]; then
            echo "No changed stateless services — nothing to deploy."
          fi
          for svc in "${services[@]}"; do
            echo "::group::deploy $svc"
            # ingestion/processing pools are Spot, scale-to-zero; node bootstrap
            # after a scale-up-from-0 event can take longer than 5m.
            helm upgrade --install "$svc" deploy/charts/rtsa-service \
              -f "deploy/charts/values/$svc.yaml" \
              --namespace "$NS" \
              --set image.repository="$ACR.azurecr.io/$svc" \
              --set image.tag="$TAG" \
              --wait --timeout 10m || {
                echo "=== Pod status in $NS ==="
                kubectl get pods -n "$NS" -o wide
                echo "=== $svc pod describe ==="
                kubectl describe pod -l app.kubernetes.io/instance="$svc" -n "$NS" || true
                echo "=== $svc pod logs ==="
                kubectl logs -l app.kubernetes.io/instance="$svc" -n "$NS" --all-containers --tail=200 || true
                exit 1
              }
            echo "::endgroup::"
          done

      - name: Deploy web-cop-gpu (frontend)
        if: ${{ inputs.deploy-web }}
        run: |
          set -euo pipefail
          helm upgrade --install web-cop-gpu deploy/charts/rtsa-service \
            -f deploy/charts/values/web-cop-gpu.yaml \
            --namespace "$NS" \
            --set image.repository="$ACR.azurecr.io/web-cop-gpu" \
            --set image.tag="$TAG" \
            --wait --timeout 10m || {
              echo "=== Pod status in $NS ==="
              kubectl get pods -n "$NS" -o wide
              echo "=== web-cop-gpu pod describe ==="
              kubectl describe pod -l app.kubernetes.io/instance=web-cop-gpu -n "$NS" || true
              echo "=== web-cop-gpu pod logs ==="
              kubectl logs -l app.kubernetes.io/instance=web-cop-gpu -n "$NS" --all-containers --tail=200 || true
              exit 1
            }

      - name: Deploy svc-webtransport (workload identity + Key Vault)
        if: ${{ contains(fromJSON(inputs.go-services), 'svc-webtransport') }}
        run: |
          set -euo pipefail
          helm upgrade --install svc-webtransport deploy/charts/rtsa-service \
            -f deploy/charts/values/svc-webtransport.yaml \
            --namespace "$NS" \
            --set image.repository="$ACR.azurecr.io/svc-webtransport" \
            --set image.tag="$TAG" \
            --set serviceAccount.workloadIdentityClientId='${{ vars.WEBTRANSPORT_IDENTITY_CLIENT_ID }}' \
            --set secretProviderClass.keyvaultName='${{ vars.KEY_VAULT_NAME }}' \
            --set secretProviderClass.tenantId='${{ vars.AZURE_TENANT_ID }}' \
            --wait --timeout 5m

      - name: Verify workload deployment
        env:
          GO_SERVICES: ${{ inputs.go-services }}
          DEPLOY_WEB: ${{ inputs.deploy-web }}
        run: |
          set -euo pipefail
          changed="$(echo "$GO_SERVICES" | jq -r '.[]')"
          if [ "$DEPLOY_WEB" = "true" ]; then
            changed="${changed}$(printf '\n')web-cop-gpu"
          fi
          scripts/azure/verify-workload-deployment.sh \
            --namespace "$NS" \
            --expected-image-tag "$TAG" \
            --changed-deployments "$(echo "$changed" | xargs)"
