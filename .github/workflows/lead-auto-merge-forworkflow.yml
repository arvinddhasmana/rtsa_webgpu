name: Lead Gatekeeper (Review & Auto-Merge)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    # Only run this automation on PRs that carry the orchestrator label (or are opened by copilot)
    if: contains(github.event.pull_request.labels.*.name, 'ai-orchestrator') || github.actor == 'github-copilot'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Automated Tests
        run: |
          echo "Replace this line with your actual test command (e.g., npm test, pytest, etc.)"
          echo "If this step fails, the workflow stops, and the PR is NOT merged."

      - name: Approve Pull Request
        # You MUST use a PAT here. GitHub prevents github-actions[bot] from approving/merging Copilot PRs directly.
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"

      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
