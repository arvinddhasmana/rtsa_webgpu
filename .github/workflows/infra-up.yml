# CLASSIFICATION: UNCLASSIFIED
# Infra Up — provision an environment's AKS landing zone with Terraform (OIDC).
# Ephemeral by design: pair with infra-down.yml to tear the environment down and
# keep PAYG cost near zero when idle.
name: Infra Up

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to provision.
        type: choice
        options: [dev, test, staging, prod]
        default: dev
        required: true

permissions:
  id-token: write # OIDC to Azure for the azurerm provider
  contents: read
  # Note: no GITHUB_TOKEN permission scope covers Environments or Environment
  # variables — that step authenticates with a PAT (GH_ENVIRONMENTS_PAT) instead.

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_SUBSCRIPTION_ID: ${{ vars.TFSTATE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="subscription_id=${{ vars.TFSTATE_SUBSCRIPTION_ID }}" \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -var-file="${{ inputs.environment }}.tfvars" -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Azure login for deployment verification
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.19

      - name: Verify infrastructure deployment
        working-directory: ${{ github.workspace }}
        run: |
          scripts/azure/verify-infrastructure-deployment.sh \
            --env "${{ inputs.environment }}" \
            --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Bootstrap dev Key Vault secrets (svc-webtransport JWT/TLS)
        if: ${{ inputs.environment == 'dev' }}
        working-directory: ${{ github.workspace }}
        run: |
          scripts/azure/bootstrap-dev-key-vault-secrets.sh --env dev

      - name: Sync Terraform outputs to GitHub Environment variables
        working-directory: ${{ github.workspace }}
        env:
          # GITHUB_TOKEN can never manage Environments or Environment-scoped
          # variables (no such permission scope exists for it) — a real PAT is required.
          # "Variables: write" covers reading/writing environment variables; the
          # script only needs "Administration: write" the first time an environment
          # (e.g. test/staging/prod) is created — existing environments (e.g. dev) skip that call.
          GH_TOKEN: ${{ secrets.GH_ENVIRONMENTS_PAT }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "ERROR: secrets.GH_ENVIRONMENTS_PAT is not set." >&2
            echo "GITHUB_TOKEN cannot create/update Environments or Environment variables (no such permission scope exists for it)." >&2
            echo "Create a fine-grained PAT with repo 'Variables: write' (+ 'Administration: write' if the environment doesn't exist yet) and store it as GH_ENVIRONMENTS_PAT." >&2
            exit 1
          fi
          scripts/azure/sync-dev-github-vars-from-tf.sh \
            --repo "${{ github.repository }}" \
            --environment "${{ inputs.environment }}"

      - name: Publish outputs to job summary
        if: always()
        run: |
          {
            echo "### Terraform outputs — ${{ inputs.environment }}"
            echo ''
            echo 'Set these as GitHub Environment variables so CD Deploy can target the cluster:'
            echo '```'
            terraform output 2>/dev/null || echo "(no outputs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
