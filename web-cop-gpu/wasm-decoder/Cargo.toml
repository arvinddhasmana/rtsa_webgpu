# CLASSIFICATION: UNCLASSIFIED
[package]
name = "wasm-decoder"
version = "0.1.0"
edition = "2021"
description = "Zero-copy FlatBuffer decoder for RTSA track updates"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
flatbuffers = "24.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
