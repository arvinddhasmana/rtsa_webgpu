// CLASSIFICATION: UNCLASSIFIED
syntax = "proto3";

package rtsa.ingestion.v1;

option go_package = "github.com/arvinddhasmana/RTSA_VS_Opus/gen/go/rtsa/ingestion/v1;ingestionv1";

import "rtsa/ingestion/v1/sensor_observation.proto";
import "rtsa/common/v1/types.proto";
import "google/protobuf/timestamp.proto";

// ──────────────────────────────────────────
// Ingestion Service — shared by all sensor types
// ──────────────────────────────────────────
service IngestionService {
  // Client-streaming: bulk sensor data ingestion
  // Deadline: 60s per stream session
  rpc IngestSensorData(stream SensorObservation) returns (IngestSummary);

  // Unary: single observation ingestion
  // Deadline: 5s
  rpc IngestSingleObservation(SensorObservation) returns (IngestionAck);

  // Unary: query sensor status
  // Deadline: 5s
  rpc GetSensorStatus(GetSensorStatusRequest) returns (SensorStatusResponse);

  // Unary: get status of all known sensors
  // Deadline: 10s
  rpc ListSensorStatuses(ListSensorStatusesRequest) returns (ListSensorStatusesResponse);
}

message IngestionAck {
  string observation_id = 1;
  bool accepted = 2;
  string rejection_reason = 3;
}

message IngestSummary {
  int64 total_received = 1;
  int64 accepted = 2;
  int64 rejected = 3;
  repeated RejectionDetail rejections = 4;
}

message RejectionDetail {
  string observation_id = 1;
  string reason = 2;
}

message GetSensorStatusRequest {
  string sensor_id = 1;
}

message SensorStatusResponse {
  string sensor_id = 1;
  rtsa.common.v1.SensorType sensor_type = 2;
  bool connected = 3;
  int64 total_received = 4;
  int64 total_accepted = 5;
  int64 total_rejected = 6;
  google.protobuf.Timestamp last_observation_time = 7;
  double events_per_second = 8;
  optional SensorCoverage coverage = 9;
}

message SensorCoverage {
  // Coverage polygon vertices (for ISR, geo-fence type sensors)
  repeated rtsa.common.v1.Position coverage_polygon = 1;
  // Maximum sensor range in nautical miles (for radar, EW)
  optional double range_nm = 2;
  // Bearing sector start in degrees true (for directional sensors)
  optional double bearing_start_degrees = 3;
  // Bearing sector end in degrees true (for directional sensors)
  optional double bearing_end_degrees = 4;
  // Sensor geographic position
  optional rtsa.common.v1.Position sensor_position = 5;
}

message ListSensorStatusesRequest {
  // Filter by sensor types (empty = all)
  repeated rtsa.common.v1.SensorType sensor_types = 1;
  // Only return sensors with observations in the last N seconds (0 = all)
  int32 active_within_seconds = 2;
}

message ListSensorStatusesResponse {
  repeated SensorStatusResponse sensors = 1;
}
